degeneracy_monitor_node:
  ros__parameters:
    kx1: 350.0
    kx2: 750.0
    ky1: 350.0
    ky2: 750.0
    kz1: 300.0
    kz2: 400.0
    delta_t: 0.05
    stagnation_epsilon: 1e-4
    max_stagnation_counts: 5

swipe_spawner:
  ros__parameters:
    impact_wall_distance: 0.3

surface_detector_node:
  ros__parameters:
    min_valid_dist: 0.2
    max_valid_dist: 6.0


vio_recovery_fsm_node:
  ros__parameters:
    enable_recovery: true        # If false, the FSM will ignore VIO failures and not trigger recovery
    delay_before_drop: 1.5       # seconds to wait in STOP before dropping ground marker
    strafe_velocity: 0.2         # m/s lateral velocity towards wall
    strafe_timeout: 20.0         # s max time to strafe before giving up
    swipe_length: 1.5            # m length of the swipe
    swipe_velocity: 0.2          # m/s forward velocity during SWIPE
    impact_force_threshold: 1.0  # N to detect wall contact

spray_heuristic_node:
  ros__parameters:
    max_reachable_dist: 5.0
    min_features_critical: 30
    max_marker_interval: 5.0

wrench_estimator_node:
  ros__parameters:
    mass: 2.23
    inertia_xx: 0.0420
    inertia_yy: 0.0280
    inertia_zz: 0.0600
    k_i_f: 10.0
    k_i_m: 20.0
    max_thrust_n: 43.8

tactile_odometry_node:
  ros__parameters:
    mass: 2.23
    inertia_xx: 0.0420
    inertia_yy: 0.0280
    inertia_zz: 0.0600
    impact_force_threshold: 0.4
    impact_torque_threshold: 0.5
    enable_tactile_odometry: true
    max_thrust_n: 43.8